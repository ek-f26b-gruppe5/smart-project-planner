<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log ind')}"><title>Log ind</title></head>
<body>
<main class="container container--narrow login">
    <p class="login__brand">Smart Project Planner</p>

    <th:block th:if="${flash}"><p th:replace="~{fragments/layout :: flash(${flash})}"></p></th:block>

    <form class="card form" method="post" th:action="@{/login}">
        <h1 class="login__title">Log ind</h1>

        <th:block th:if="${error}"><p th:replace="~{fragments/layout :: error(${error})}"></p></th:block>

        <div class="form__field">
            <label class="form__label" for="email">E-mail</label>
            <input class="form__input" id="email" type="email" name="email"
                   autocomplete="email" required autofocus>
        </div>

        <div class="form__field">
            <label class="form__label" for="password">Adgangskode</label>
            <input class="form__input" id="password" type="password" name="password"
                   autocomplete="current-password" required>
        </div>

        <button class="btn btn--primary" type="submit">Log ind</button>
    </form>

    <p class="login__footer text-muted">Ny bruger? <a th:href="@{/register}">Opret en konto</a></p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
