<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' – Smart Project Planner'">Smart Project Planner</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Flash message (success) -->
<p th:fragment="flash(message)" class="alert alert--success" role="status" th:text="${message}">Besked</p>
<!-- Flash message (error) -->
<p th:fragment="error(message)" class="alert alert--error" role="alert" th:text="${message}">Fejl</p>

<footer th:fragment="footer" class="site-footer">
    <small>Smart Project Planner · Gruppe 5</small>
</footer>

</body>
</html>
