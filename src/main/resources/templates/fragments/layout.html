<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' – Smart Project Planner'">Smart Project Planner</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:fragment="header" class="site-header">
    <a class="site-header__brand" th:href="@{/}">Smart Project Planner</a>
    <nav class="site-header__nav" th:if="${session.userId != null}">
        <span th:text="${session.userName}">Navn</span>
        <form class="site-header__logout" th:action="@{/logout}" method="post">
            <button class="btn btn--link" type="submit">Log ud</button>
        </form>
    </nav>
    <nav class="site-header__nav" th:unless="${session.userId != null}">
        <a th:href="@{/login}">Log ind</a>
    </nav>
</header>

<p th:fragment="flash(message)" class="alert alert--success" role="status" th:text="${message}">Besked</p>

<footer th:fragment="footer" class="site-footer">
    <small>Smart Project Planner · Gruppe 5 · EK</small>
</footer>

</body>
</html>
